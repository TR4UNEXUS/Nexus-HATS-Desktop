name: Complete a queued Mac build
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run containing the successful Intel runtime artifact
        required: true
      source_commit:
        description: Exact source commit used by that run
        required: true
      runner:
        description: Apple Silicon runner pool
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
permissions:
  contents: read
  actions: read
defaults:
  run:
    working-directory: macOS
jobs:
  complete:
    name: Build and verify on Apple Silicon
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - name: Match the Intel artifact to this source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare test files
        run: |
          mkdir -p "$RUNNER_TEMP/hats-tests" "$RUNNER_TEMP/inputs"
          echo "HATS_TEST_ROOT=$RUNNER_TEMP/hats-tests" >> "$GITHUB_ENV"
      - name: Test protections and layout
        run: |
          dotnet run --project source/Hats.Mac.Tests -c Release
          dotnet run --project source/Hats.Mac.Tests -c Release -- --render
      - name: Build and check the ARM app
        run: |
          dotnet publish source/Hats.Mac -c Release -r osx-arm64 --self-contained true -o "$RUNNER_TEMP/publish"
          "$RUNNER_TEMP/publish/Nexus.HATS.Desktop" --native-smoke
          "$RUNNER_TEMP/publish/Nexus.HATS.Desktop" --startup-check "$RUNNER_TEMP/hats-tests/native-startup.json"
          tar -czf "$RUNNER_TEMP/inputs/osx-arm64.tar.gz" -C "$RUNNER_TEMP/publish" .
          template=$(find "$DOTNET_ROOT/packs" "$HOME/.nuget/packages" -path '*/runtimes/osx-arm64/native/apphost' -type f | sort | tail -1)
          test -n "$template"
          cp "$template" "$RUNNER_TEMP/inputs/apphost-template-osx-arm64"
      - uses: actions/download-artifact@v4
        with:
          name: runtime-osx-x64
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Package and verify the universal DMG on Apple Silicon
        run: |
          python -m pip install ds_store==1.3.1
          python packaging/build-universal.py --inputs "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/universal"
          python packaging/verify-dmg.py "$RUNNER_TEMP/universal/Nexus-HATS-Desktop-Universal.dmg" "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        with:
          name: universal-dmg-recovery
          path: |
            ${{ runner.temp }}/universal/Nexus-HATS-Desktop-Universal.dmg
            ${{ runner.temp }}/universal/SHA256.txt
            ${{ runner.temp }}/universal/INSTALL.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-arm-checks
          path: |
            ${{ runner.temp }}/hats-tests/*.json
            ${{ runner.temp }}/hats-tests/*.png
            ${{ runner.temp }}/verified/startup.json
            ${{ runner.temp }}/verified/update-check/update-validation.json
          retention-days: 30
  verify_intel:
    name: Verify the same DMG on Intel
    needs: complete
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: universal-dmg-recovery
          path: ${{ runner.temp }}/dmg
      - name: Check packaged app and updater
        run: python3 packaging/verify-dmg.py "$RUNNER_TEMP/dmg/Nexus-HATS-Desktop-Universal.dmg" "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-intel-checks
          path: |
            ${{ runner.temp }}/verified/startup.json
            ${{ runner.temp }}/verified/update-check/update-validation.json
          retention-days: 30
